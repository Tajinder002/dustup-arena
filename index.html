<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dustup Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#161a22;--panel:#232a36;--line:#3a4558;--text:#eef1f6;--mute:#9aa6ba;--accent:#ff6b57}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Chakra Petch",system-ui,sans-serif}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);z-index:5}
.card{width:100%;max-width:380px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:24px}
h1{margin:0 0 4px;font-size:34px;letter-spacing:.5px}
p.s{margin:0 0 18px;color:var(--mute);font-size:14px}
input{width:100%;padding:12px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px;margin-bottom:10px}
input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{width:100%;padding:12px;border-radius:8px;border:0;background:var(--accent);color:#1a0d0a;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
button.alt{background:transparent;color:var(--text);border:2px solid var(--line)}
.row{display:flex;gap:8px}.row input{margin:0}.row button{width:auto;padding:0 18px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
#msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--mute)}
#game{display:none;position:fixed;inset:0;align-items:center;justify-content:center}
canvas{max-width:100vw;max-height:100vh;aspect-ratio:1000/650;background:#232a36;cursor:crosshair;touch-action:none}
#hud{position:fixed;top:8px;left:8px;font-size:14px;background:#161a22cc;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#hud b{color:var(--accent)}
</style>
</head>
<body>
<div id="menu"><div class="card">
  <h1>Dustup Arena</h1>
  <p class="s">Top-down arena shooter. Up to 6 players, no server needed.</p>
  <input id="name" maxlength="12" placeholder="Your name" autocomplete="off">
  <button id="host">Host a game</button>
  <hr>
  <div class="row"><input id="code" maxlength="4" placeholder="Room code" autocomplete="off"><button class="alt" id="join">Join</button></div>
  <div id="msg" role="status"></div>
  <p class="s" style="margin:14px 0 0">Move with WASD or arrows. Aim with the mouse. Hold click to shoot.</p>
</div></div>
<div id="game"><canvas id="c" width="1000" height="650"></canvas></div>
<div id="hud" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
"use strict";
const W=1000,H=650,R=16,PREFIX="dustup-arena-",COLORS=["#ff6b57","#4cc9f0","#ffd166","#06d6a0","#b388ff","#ff8fab"];
const WALLS=[[430,260,140,130],[140,120,30,160],[830,370,30,160],[200,470,160,30],[640,120,160,30],[60,300,60,30],[880,300,60,30]];
const $=id=>document.getElementById(id), cv=$("c"), ctx=cv.getContext("2d");
let peer,isHost=false,myId=null,room="",hostConn=null,conns={},inputs={},players={},bullets=[],snap=null;
const keys={},mouse={x:W/2,y:H/2,down:false};

function msg(t){$("msg").textContent=t}
function rnd(n){return Math.floor(Math.random()*n)}
function newCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ";let s="";for(let i=0;i<4;i++)s+=a[rnd(a.length)];return s}
function hitsWall(x,y,r){for(const[a,b,w,h]of WALLS){const cx=Math.max(a,Math.min(x,a+w)),cy=Math.max(b,Math.min(y,b+h));if((x-cx)**2+(y-cy)**2<r*r)return true}return false}
function spawnPoint(){for(let i=0;i<50;i++){const x=R+rnd(W-2*R),y=R+rnd(H-2*R);if(!hitsWall(x,y,R+20))return[x,y]}return[50,50]}
function addPlayer(id,name){const[x,y]=spawnPoint();const used=Object.values(players).map(p=>p.c);let c=0;while(used.includes(c))c++;players[id]={x,y,a:0,hp:100,k:0,d:0,name:(name||"Player").slice(0,12),c:c%COLORS.length,dead:0,cd:0}}

/* ---------- Host simulation ---------- */
function move(p,dx,dy){
  const nx=Math.max(R,Math.min(W-R,p.x+dx));if(!hitsWall(nx,p.y,R))p.x=nx;
  const ny=Math.max(R,Math.min(H-R,p.y+dy));if(!hitsWall(p.x,ny,R))p.y=ny;
}
function step(dt){
  for(const id in players){
    const p=players[id],i=inputs[id]||{};
    if(p.dead>0){p.dead-=dt;if(p.dead<=0){const[x,y]=spawnPoint();p.x=x;p.y=y;p.hp=100;p.dead=0}continue}
    let dx=(i.r?1:0)-(i.l?1:0),dy=(i.d?1:0)-(i.u?1:0);const m=Math.hypot(dx,dy)||1;
    move(p,dx/m*230*dt,dy/m*230*dt);
    if(typeof i.a==="number")p.a=i.a;
    p.cd-=dt;
    if(i.s&&p.cd<=0){p.cd=0.2;bullets.push({x:p.x+Math.cos(p.a)*R,y:p.y+Math.sin(p.a)*R,vx:Math.cos(p.a)*620,vy:Math.sin(p.a)*620,o:id,t:1.1})}
  }
  for(let n=bullets.length-1;n>=0;n--){
    const b=bullets[n];b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;
    let dead=b.t<=0||b.x<0||b.y<0||b.x>W||b.y>H||hitsWall(b.x,b.y,3);
    if(!dead)for(const id in players){const p=players[id];
      if(id===b.o||p.dead>0)continue;
      if((p.x-b.x)**2+(p.y-b.y)**2<(R+3)**2){
        p.hp-=25;dead=true;
        if(p.hp<=0){p.dead=3;p.d++;if(players[b.o])players[b.o].k++}
        break}}
    if(dead)bullets.splice(n,1);
  }
}
function broadcast(){
  const s={p:Object.entries(players).map(([id,p])=>[id,p.x|0,p.y|0,+p.a.toFixed(2),p.hp,p.k,p.d,p.name,p.c,p.dead>0?1:0]),b:bullets.map(b=>[b.x|0,b.y|0])};
  const str=JSON.stringify(s);
  for(const id in conns)if(conns[id].open)conns[id].send(str);
  snap=s;
}

/* ---------- Networking ---------- */
function startHost(name,tries=0){
  room=newCode();msg("Creating room...");
  peer=new Peer(PREFIX+room);
  peer.on("open",id=>{
    isHost=true;myId=id;addPlayer(id,name);enterGame();
    setInterval(()=>step(1/60),1000/60);
    setInterval(()=>{inputs[myId]=localInput();broadcast()},1000/20);
    let last=performance.now();
    (function loop(t){inputs[myId]=localInput();draw();requestAnimationFrame(loop)})();
  });
  peer.on("connection",c=>{
    c.on("data",d=>{
      if(d&&d.t==="join"){
        if(Object.keys(players).length>=6){c.send(JSON.stringify({full:1}));setTimeout(()=>c.close(),300);return}
        conns[c.peer]=c;addPlayer(c.peer,d.name);
      }else if(d&&d.t==="in"&&players[c.peer])inputs[c.peer]=d;
    });
    c.on("close",()=>{delete conns[c.peer];delete players[c.peer];delete inputs[c.peer]});
  });
  peer.on("error",e=>{
    if(e.type==="unavailable-id"&&tries<5){peer.destroy();startHost(name,tries+1)}
    else msg("Could not start: "+e.type);
  });
}
function startJoin(name,code){
  room=code.toUpperCase();msg("Connecting...");
  peer=new Peer();
  peer.on("open",id=>{
    myId=id;hostConn=peer.connect(PREFIX+room,{reliable:false});
    const to=setTimeout(()=>msg("Room not found. Check the code."),8000);
    hostConn.on("open",()=>{clearTimeout(to);hostConn.send({t:"join",name});enterGame();
      setInterval(()=>{if(hostConn.open)hostConn.send(Object.assign({t:"in"},localInput()))},1000/30);
      (function loop(){draw();requestAnimationFrame(loop)})();
    });
    hostConn.on("data",d=>{const s=JSON.parse(d);if(s.full){alert("Room is full.");location.reload()}else snap=s});
    hostConn.on("close",()=>{alert("Host left the game.");location.reload()});
  });
  peer.on("error",e=>msg(e.type==="peer-unavailable"?"Room not found. Check the code.":"Connection error: "+e.type));
}

/* ---------- Input ---------- */
function localInput(){
  let ax=W/2,ay=H/2;const me=getMe();if(me){ax=me.x;ay=me.y}
  return{u:keys.w||keys.arrowup,d:keys.s||keys.arrowdown,l:keys.a||keys.arrowleft,r:keys.d||keys.arrowright,s:mouse.down,a:Math.atan2(mouse.y-ay,mouse.x-ax)};
}
function getMe(){
  if(isHost)return players[myId];
  if(!snap)return null;const r=snap.p.find(p=>p[0]===myId);return r?{x:r[1],y:r[2]}:null;
}
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith("Arrow"))e.preventDefault()});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});
cv.addEventListener("pointerdown",e=>{mouse.down=true;cv.setPointerCapture(e.pointerId)});
addEventListener("pointerup",()=>mouse.down=false);
cv.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- Rendering ---------- */
function enterGame(){
  $("menu").style.display="none";$("game").style.display="flex";
  const h=$("hud");h.hidden=false;
  h.innerHTML=isHost?`Room <b>${room}</b> &nbsp; <a href="#" id="cp" style="color:#9aa6ba">copy invite link</a>`:`Room <b>${room}</b>`;
  const cp=$("cp");if(cp)cp.onclick=e=>{e.preventDefault();navigator.clipboard.writeText(location.origin+location.pathname+"?room="+room);cp.textContent="copied"};
}
function draw(){
  const s=isHost?{p:Object.entries(players).map(([id,p])=>[id,p.x,p.y,p.a,p.hp,p.k,p.d,p.name,p.c,p.dead>0?1:0]),b:bullets.map(b=>[b.x,b.y])}:snap;
  ctx.fillStyle="#232a36";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#2c3544";ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<=W;x+=50){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<=H;y+=50){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
  ctx.fillStyle="#3a4558";for(const[a,b,w,h]of WALLS)ctx.fillRect(a,b,w,h);
  if(!s){ctx.fillStyle="#9aa6ba";ctx.font="20px sans-serif";ctx.textAlign="center";ctx.fillText("Waiting for host...",W/2,H/2);return}
  ctx.fillStyle="#ffe9b0";for(const b of s.b){ctx.beginPath();ctx.arc(b[0],b[1],4,0,7);ctx.fill()}
  ctx.textAlign="center";ctx.font="bold 13px 'Chakra Petch',sans-serif";
  for(const[id,x,y,a,hp,k,d,name,c,dead]of s.p){
    if(dead){ctx.globalAlpha=.25}
    ctx.fillStyle=COLORS[c];ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();
    ctx.strokeStyle=id===myId?"#fff":"#161a22";ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle="#161a22";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*(R+10),y+Math.sin(a)*(R+10));ctx.stroke();
    ctx.globalAlpha=1;
    if(!dead){ctx.fillStyle="#161a22";ctx.fillRect(x-20,y-R-14,40,5);ctx.fillStyle=hp>40?"#06d6a0":"#ff6b57";ctx.fillRect(x-20,y-R-14,40*hp/100,5)}
    ctx.fillStyle="#eef1f6";ctx.fillText(name,x,y+R+16);
  }
  const sorted=[...s.p].sort((a,b)=>b[5]-a[5]);
  ctx.textAlign="right";ctx.font="14px 'Chakra Petch',sans-serif";
  sorted.forEach((p,i)=>{ctx.fillStyle=COLORS[p[8]];ctx.fillText(`${p[7]}  ${p[5]} / ${p[6]}`,W-12,22+i*20)});
  const me=s.p.find(p=>p[0]===myId);
  if(me&&me[9]){ctx.textAlign="center";ctx.fillStyle="#eef1f6";ctx.font="bold 28px 'Chakra Petch',sans-serif";ctx.fillText("You were hit. Respawning...",W/2,60)}
}

/* ---------- Menu ---------- */
$("name").value=localStorage.getItem("dustup-name")||"";
const q=new URLSearchParams(location.search).get("room");if(q)$("code").value=q.toUpperCase().slice(0,4);
function nm(){const n=$("name").value.trim()||"Player"+rnd(100);try{localStorage.setItem("dustup-name",n)}catch(e){}return n}
$("host").onclick=()=>startHost(nm());
$("join").onclick=()=>{const c=$("code").value.trim();if(c.length!==4)return msg("Enter the 4-letter room code.");startJoin(nm(),c)};
</script>
</body>
</html>
