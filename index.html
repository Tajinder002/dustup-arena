<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dustup Arena 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#161a22;--panel:#232a36;--line:#3a4558;--text:#eef1f6;--mute:#9aa6ba;--accent:#ff6b57}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Chakra Petch",system-ui,sans-serif}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);z-index:5}
.card{width:100%;max-width:380px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:24px}
h1{margin:0 0 4px;font-size:34px;letter-spacing:.5px}
p.s{margin:0 0 18px;color:var(--mute);font-size:14px}
input{width:100%;padding:12px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px;margin-bottom:10px}
select{width:100%;padding:12px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px;margin-bottom:10px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{width:100%;padding:12px;border-radius:8px;border:0;background:var(--accent);color:#1a0d0a;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
button.alt{background:transparent;color:var(--text);border:2px solid var(--line)}
.row{display:flex;gap:8px}.row input{margin:0}.row button{width:auto;padding:0 18px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
#msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--mute)}
#game{display:none;position:fixed;inset:0;align-items:center;justify-content:center}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#c{cursor:none}
#hud{position:fixed;top:8px;left:8px;font-size:14px;background:#161a22cc;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#hud b{color:var(--accent)}
</style>
</head>
<body>
<div id="menu"><div class="card">
  <h1>Dustup Arena</h1>
  <p class="s">3D city shooter. Up to 6 players, no server needed.</p>
  <input id="name" maxlength="12" placeholder="Your name" autocomplete="off">
  <label for="map" class="s" style="display:block;margin:0 0 6px">Map (host chooses)</label>
  <select id="map"></select>
  <button id="host">Host a game</button>
  <hr>
  <div class="row"><input id="code" maxlength="4" placeholder="Room code" autocomplete="off"><button class="alt" id="join">Join</button></div>
  <div id="msg" role="status"></div>
  <p class="s" style="margin:14px 0 0">Move with WASD. Move the mouse to turn. Click once to lock the mouse, then hold click to shoot. Space to jump. R to reload.</p>
</div></div>
<div id="game"><canvas id="gl"></canvas><canvas id="c"></canvas></div>
<div id="hud" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
"use strict";
const W=2400,H=1560,SPD=320,MAG=30,RT=1.8,R=16,PREFIX="dustup-arena-",COLORS=["#ff6b57","#4cc9f0","#ffd166","#06d6a0","#b388ff","#ff8fab"];
const MAPS=[
 {name:"New York",sky:0x9ec7e8,ground:0x3a3d42,edge:0x777777,amb:.7,lit:0,win:"#5f7f9c",tint:[0xb5654a,0x9a9a9a,0xc9b8a0,0x7d8da1],
  walls:[60,300,540,780].flatMap(x=>[45,265,485].map(y=>[x,y,160,140])).filter(([x,y])=>!(y===265&&(x===300||x===540))),
  park:[[300,265,400,140]],hf:i=>i===7?200:70+((i*53)%9)*22,
  extra:bx=>{bx(860,200,115,90,50,90,0xcfc7b0);bx(860,250,115,50,40,50,0xcfc7b0);bx(860,290,115,12,50,12,0xcfc7b0)}},
 {name:"Paris",sky:0xbcd6ee,ground:0x6e6a60,edge:0x8a8478,amb:.75,lit:0,win:"#6a7f95",tint:[0xe8dcc0,0xdccfb0,0xf0e6cf],
  walls:[[60,60,230,120],[60,470,230,120],[710,60,230,120],[710,470,230,120],[330,60,340,70],[330,520,340,70],[60,260,140,130],[800,260,140,130],[422,247,24,24],[554,247,24,24],[422,379,24,24],[554,379,24,24]],
  hf:i=>i<8?55+((i*7)%4)*8:10,
  extra:(bx,G)=>{const t=new THREE.Mesh(new THREE.ConeGeometry(110,320,4),new THREE.MeshLambertMaterial({color:0x7a5c3e}));t.position.set(500,160,325);t.rotation.y=Math.PI/4;G.add(t)}},
 {name:"Tokyo",sky:0x120d24,ground:0x1c1c26,edge:0x333344,amb:.5,lit:1,win:"",tint:[0xff4fa3,0x4fd8ff,0xb06bff,0xffffff,0xffd84f],
  walls:[[60,50,300,200],[640,50,300,200],[60,400,300,200],[640,400,300,200],[420,60,160,80],[420,510,160,80],[60,285,110,80],[830,285,110,80]],
  hf:i=>90+((i*61)%5)*50,
  extra:bx=>{for(let i=0;i<8;i++){bx(400+i*28,0,262,16,.8,40,0xdddddd);bx(400+i*28,0,388,16,.8,40,0xdddddd)}}},
 {name:"Dubai",sky:0x8fd0ff,ground:0xd2b886,edge:0xb89c68,amb:.8,lit:0,win:"#9fd6ee",tint:[0x7fc4e0,0x9ad0e8,0xb8d8e8,0x6fb0cc],
  walls:[[100,100,90,90],[260,180,70,70],[700,150,80,80],[820,380,90,90],[240,430,80,80],[650,450,70,70],[110,330,60,60],[880,150,60,60],[470,295,60,60],[420,100,60,50],[560,540,60,50]],
  hf:i=>i===8?60:100+((i*47)%6)*45,
  extra:(bx,G)=>{[[24,32,200,100],[14,24,200,300],[2,14,160,480]].forEach(([a,b,h,y])=>{const t=new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,6),new THREE.MeshLambertMaterial({color:0xc8e0ee}));t.position.set(500,y,325);G.add(t)})}}
];
const K=2.4;MAPS.forEach(m=>{m.walls=m.walls.map(w=>w.map(v=>v*K));m.park=(m.park||[]).map(w=>w.map(v=>v*K));const f=m.hf;m.hf=i=>f(i)*1.6;m.WH=m.walls.map((_,i)=>m.hf(i))});
let wasDead=false,myz=0,myvz=0,pitch=0,mapIdx=0,WALLS=MAPS[0].walls,WH=MAPS[0].WH,scene,cam,ren,mapG,pm={},bm=[],bGeo,bMat,yaw=0;
const $=id=>document.getElementById(id), cv=$("c"), ctx=cv.getContext("2d");
let peer,isHost=false,myId=null,room="",hostConn=null,conns={},inputs={},players={},bullets=[],snap=null;
const keys={},mouse={x:W/2,y:H/2,down:false};
let snaps=[],off=null,meP=null,shots=0,prevShots=0,audio=null,flash=0,prevHp={},hitT={},lastDraw=performance.now();

/* ---------- Sound (synthesized, no files) ---------- */
function initAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume()}catch(e){}}
function sfxShot(){
  if(!audio)return;const t=audio.currentTime,n=Math.floor(audio.sampleRate*0.14),buf=audio.createBuffer(1,n,audio.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const src=audio.createBufferSource();src.buffer=buf;const g=audio.createGain();g.gain.value=0.22;src.connect(g).connect(audio.destination);src.start(t);
  const o=audio.createOscillator(),og=audio.createGain();o.type="sawtooth";o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(50,t+0.12);
  og.gain.setValueAtTime(0.18,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.13);o.connect(og).connect(audio.destination);o.start(t);o.stop(t+0.14);
}
function sfxHurt(){
  if(!audio)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
  o.type="square";o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(80,t+0.2);
  g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+0.23);
}

/* ---------- Blocky Steve-style player (drawn with code) ---------- */
function steve(x,y,a,hit){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  const f=(c,hc,rx,ry,w,h)=>{ctx.fillStyle=hit?hc:c;ctx.fillRect(rx,ry,w,h)};
  f("#00a8a8","#ff2b2b",-6,-14,12,28);          // shirt / shoulders
  f("#c69274","#ff6a6a",-6,-14,12,5);           // back arm
  f("#c69274","#ff6a6a",-6,9,12,5);             // front arm
  f("#c69274","#ff6a6a",6,8,10,5);              // arm reaching forward
  f("#8a8f98","#b02020",14,7,9,3);              // gun barrel
  f("#4a2f1b","#b01818",-8,-8,16,16);           // hair
  f("#c69274","#ff6a6a",3,-8,5,16);             // face
  f("#ffffff","#ffffff",5,-5,2,2);f("#ffffff","#ffffff",5,3,2,2);
  f("#3b2a8c","#7a0000",6,-5,1,2);f("#3b2a8c","#7a0000",6,3,1,2);
  ctx.restore();
}

function msg(t){$("msg").textContent=t}
function setMap(i){
  if(!MAPS[i]||i===mapIdx&&WALLS===MAPS[i].walls)return;
  mapIdx=i;WALLS=MAPS[i].walls;WH=MAPS[i].WH;
  const mn=$("mapname");if(mn)mn.textContent=MAPS[i].name;
  if(scene)buildMap();
}
function rnd(n){return Math.floor(Math.random()*n)}
function newCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ";let s="";for(let i=0;i<4;i++)s+=a[rnd(a.length)];return s}
function wallAt(x,y,r){for(let i=0;i<WALLS.length;i++){const[a,b,w,h]=WALLS[i],cx=Math.max(a,Math.min(x,a+w)),cy=Math.max(b,Math.min(y,b+h));if((x-cx)**2+(y-cy)**2<r*r)return i}return -1}
function hitsWall(x,y,r){return wallAt(x,y,r)>=0}
function spawnPoint(){for(let i=0;i<50;i++){const x=R+rnd(W-2*R),y=R+rnd(H-2*R);if(!hitsWall(x,y,R+20))return[x,y]}return[50,50]}
function uniqName(n){
  n=(n||"Player").trim().slice(0,12)||"Player";
  const taken=new Set(Object.values(players).map(p=>p.name.toLowerCase()));
  if(!taken.has(n.toLowerCase()))return n;
  for(let i=2;;i++){const t=String(i),c=n.slice(0,12-t.length)+t;if(!taken.has(c.toLowerCase()))return c}
}
function addPlayer(id,name){const[x,y]=spawnPoint();const used=Object.values(players).map(p=>p.c);let c=0;while(used.includes(c))c++;players[id]={x,y,a:0,hp:100,k:0,d:0,name:uniqName(name),c:c%COLORS.length,dead:0,cd:0,z:0,vz:0,pi:0,ammo:MAG,rl:0}}

/* ---------- Host simulation ---------- */
function move(p,dx,dy){
  const nx=Math.max(R,Math.min(W-R,p.x+dx));if(!hitsWall(nx,p.y,R))p.x=nx;
  const ny=Math.max(R,Math.min(H-R,p.y+dy));if(!hitsWall(p.x,ny,R))p.y=ny;
}
function step(dt){
  for(const id in players){
    const p=players[id],i=inputs[id]||{};
    if(p.dead>0){p.dead-=dt;if(p.dead<=0){const[x,y]=spawnPoint();p.x=x;p.y=y;p.hp=100;p.dead=0;p.z=0;p.vz=0;p.ammo=MAG;p.rl=0}continue}
    let dx=i.mx||0,dy=i.my||0;const m=Math.hypot(dx,dy)||1;
    move(p,dx/m*SPD*dt,dy/m*SPD*dt);
    if(typeof i.a==="number")p.a=i.a;
    if(typeof i.p==="number")p.pi=Math.max(-1.2,Math.min(1.2,i.p));
    if(i.j&&p.z<=0)p.vz=420;
    p.vz-=1100*dt;p.z+=p.vz*dt;if(p.z<=0){p.z=0;p.vz=0}
    p.cd-=dt;
    if(p.rl>0){p.rl-=dt;if(p.rl<=0){p.rl=0;p.ammo=MAG}}else if(i.r&&p.ammo<MAG)p.rl=RT;
    if(i.s&&p.cd<=0&&p.rl<=0&&p.ammo>0){p.cd=0.2;p.ammo--;if(p.ammo<=0)p.rl=RT;shots++;const ca=Math.cos(p.a),sa=Math.sin(p.a),cp=Math.cos(p.pi),sp=Math.sin(p.pi);bullets.push({x:p.x-sa*10+ca*R,y:p.y+ca*10+sa*R,z:p.z+36,vx:ca*cp*1000,vy:sa*cp*1000,vz:sp*1000,o:id,t:2})}
  }
  for(let n=bullets.length-1;n>=0;n--){
    const b=bullets[n];b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;b.t-=dt;
    const wi=wallAt(b.x,b.y,3);
    let dead=b.t<=0||b.z<0||b.x<0||b.y<0||b.x>W||b.y>H||(wi>=0&&b.z<WH[wi]);
    if(!dead)for(const id in players){const p=players[id];
      if(id===b.o||p.dead>0)continue;
      if((p.x-b.x)**2+(p.y-b.y)**2<(R+3)**2&&b.z>p.z&&b.z<p.z+42){
        p.hp-=25;dead=true;
        if(p.hp<=0){p.dead=3;p.d++;if(players[b.o]){players[b.o].k++;players[b.o].hp=100}}
        break}}
    if(dead)bullets.splice(n,1);
  }
}
function broadcast(){
  const s={p:Object.entries(players).map(([id,p])=>[id,p.x|0,p.y|0,+p.a.toFixed(2),p.hp,p.k,p.d,p.name,p.c,p.dead>0?1:0,p.z|0,p.ammo,p.rl>0?Math.max(1,Math.round(100-p.rl/RT*100)):0]),b:bullets.map(b=>[b.x|0,b.y|0,b.z|0,b.vx|0,b.vy|0,b.vz|0]),sh:shots,m:mapIdx,t:performance.now()/1000};
  const str=JSON.stringify(s);
  for(const id in conns){const c=conns[id];if(c.open&&!(c.dataChannel&&c.dataChannel.bufferedAmount>16000))c.send(str)}
  snap=s;
}

/* ---------- Networking ---------- */
function startHost(name,tries=0){
  room=newCode();msg("Creating room...");
  peer=new Peer(PREFIX+room);
  peer.on("open",id=>{
    isHost=true;myId=id;setMap(+$("map").value||0);addPlayer(id,name);enterGame();
    let last=performance.now(),acc=0;
    function tick(){
      const now=performance.now();let rem=Math.min(.25,(now-last)/1000);last=now;acc+=rem;
      inputs[myId]=localInput();
      while(rem>0){const d=Math.min(rem,1/60);step(d);rem-=d}
      if(acc>=1/30){acc=0;broadcast()}
    }
    setInterval(tick,16);
    (function loop(){draw();requestAnimationFrame(loop)})();
  });
  peer.on("connection",c=>{
    c.on("data",d=>{
      if(d&&d.t==="join"){if(conns[c.peer])return;
        if(Object.keys(players).length>=6){c.send(JSON.stringify({full:1}));setTimeout(()=>c.close(),300);return}
        conns[c.peer]=c;addPlayer(c.peer,d.name);
      }else if(d&&d.t==="in"&&players[c.peer])inputs[c.peer]=d;
    });
    c.on("close",()=>{delete conns[c.peer];delete players[c.peer];delete inputs[c.peer]});
  });
  peer.on("error",e=>{
    if(e.type==="unavailable-id"&&tries<5){peer.destroy();startHost(name,tries+1)}
    else msg("Could not start: "+e.type);
  });
}
function startJoin(name,code){
  room=code.toUpperCase();msg("Connecting...");
  peer=new Peer();
  peer.on("open",id=>{
    myId=id;hostConn=peer.connect(PREFIX+room,{reliable:false});
    const to=setTimeout(()=>msg("Room not found. Check the code."),8000);
    hostConn.on("open",()=>{clearTimeout(to);enterGame();
      hostConn.send({t:"join",name});
      const j=setInterval(()=>{if(snaps.length)clearInterval(j);else if(hostConn.open)hostConn.send({t:"join",name})},400);
      setInterval(()=>{if(hostConn.open&&!(hostConn.dataChannel&&hostConn.dataChannel.bufferedAmount>8000))hostConn.send(Object.assign({t:"in"},localInput()))},1000/30);
      (function loop(){draw();requestAnimationFrame(loop)})();
    });
    hostConn.on("data",d=>{
      const s=JSON.parse(d);if(s.full){alert("Room is full.");location.reload();return}
      if(typeof s.m==="number")setMap(s.m);
      const now=performance.now()/1000,o=now-s.t;off=off===null?o:off*0.95+o*0.05;
      s.rt=now;snaps.push(s);if(snaps.length>12)snaps.shift();
    });
    hostConn.on("close",()=>{alert("Host left the game.");location.reload()});
  });
  peer.on("error",e=>msg(e.type==="peer-unavailable"?"Room not found. Check the code.":"Connection error: "+e.type));
}

/* ---------- Input ---------- */
function localInput(){
  const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),r=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),c=Math.cos(yaw),n=Math.sin(yaw);
  return{mx:f*c-r*n,my:f*n+r*c,s:mouse.down,a:yaw,p:pitch,j:!!keys[" "],r:!!keys.r};
}
function getMe(){
  if(isHost)return players[myId];
  return meP;
}
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith("Arrow"))e.preventDefault()});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
cv.addEventListener("pointerdown",()=>{if(document.pointerLockElement!==cv){cv.requestPointerLock&&cv.requestPointerLock();return}mouse.down=true});
addEventListener("pointerup",()=>mouse.down=false);
addEventListener("mousemove",e=>{if(document.pointerLockElement===cv){yaw+=e.movementX*0.0025;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*0.0025))}});
cv.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- Client smoothing: interpolation + prediction ---------- */
function clientView(dt){
  const sn=snaps[snaps.length-1];if(!sn)return null;
  const now=performance.now()/1000,rt=now-off-0.12;
  let ai=-1;for(let i=0;i<snaps.length;i++){if(snaps[i].t<=rt)ai=i;else break}
  let A=snaps[Math.max(ai,0)],B=snaps[Math.min(ai+1,snaps.length-1)];
  const lastI=ai>=snaps.length-1&&snaps.length>1;if(lastI){A=snaps[snaps.length-2];B=snaps[snaps.length-1]}
  const k=B.t>A.t?Math.min(lastI?1.5:1,Math.max(0,(rt-A.t)/(B.t-A.t))):0;
  const out=sn.p.map(r=>{
    const pa=A.p.find(q=>q[0]===r[0]),pb=B.p.find(q=>q[0]===r[0]);
    let x=r[1],y=r[2],a=r[3],z=r[10]||0;
    if(pa&&pb&&Math.hypot(pb[1]-pa[1],pb[2]-pa[2])<200){
      x=pa[1]+(pb[1]-pa[1])*k;y=pa[2]+(pb[2]-pa[2])*k;
      let da=pb[3]-pa[3];da=Math.atan2(Math.sin(da),Math.cos(da));a=pa[3]+da*k;z=(pa[10]||0)+((pb[10]||0)-(pa[10]||0))*k;
    }else if(pb){x=pb[1];y=pb[2];a=pb[3]}
    return[r[0],x,y,a,r[4],r[5],r[6],r[7],r[8],r[9],z,r[11],r[12]];
  });
  const sv=sn.p.find(r=>r[0]===myId),me=out.find(r=>r[0]===myId);
  if(sv&&me){
    const rs=wasDead&&!sv[9];wasDead=!!sv[9];
    if(!meP||sv[9]||rs||Math.hypot(sv[1]-meP.x,sv[2]-meP.y)>300){meP={x:sv[1],y:sv[2]};myz=0;myvz=0}
    else{
      const i=localInput(),dx=i.mx,dy=i.my,m=Math.hypot(dx,dy)||1;
      move(meP,dx/m*SPD*dt,dy/m*SPD*dt);
      const ex=sv[1]-meP.x,ey=sv[2]-meP.y;
      if(hitsWall(meP.x,meP.y,R-2))meP={x:sv[1],y:sv[2]};
      else if(Math.hypot(ex,ey)>110){const g=Math.min(1,dt*6),nx=meP.x+ex*g,ny=meP.y+ey*g;if(!hitsWall(nx,ny,R-2)){meP.x=nx;meP.y=ny}}
    }
    const li=localInput();if(li.j&&myz<=0)myvz=420;myvz-=1100*dt;myz+=myvz*dt;if(myz<=0){myz=0;myvz=0}if(Math.abs(myz-(sv[10]||0))>80)myz=sv[10]||0;
    me[1]=meP.x;me[2]=meP.y;me[3]=li.a;me[10]=myz;
  }
  const el=Math.min(.12,now-sn.rt);
  return{p:out,b:sn.b.map(b=>[b[0]+b[3]*el,b[1]+b[4]*el,b[2]+b[5]*el]),sh:sn.sh};
}

/* ---------- Rendering ---------- */
function enterGame(){
  $("menu").style.display="none";$("game").style.display="flex";if(!scene)initGL();
  const h=$("hud");h.hidden=false;
  h.innerHTML=(isHost?`Room <b>${room}</b> &nbsp; <a href="#" id="cp" style="color:#9aa6ba">copy invite link</a>`:`Room <b>${room}</b>`)+` &nbsp; Map: <span id="mapname">${MAPS[mapIdx].name}</span>`;
  const cp=$("cp");if(cp)cp.onclick=e=>{e.preventDefault();navigator.clipboard.writeText(location.origin+location.pathname+"?room="+room);cp.textContent="copied"};
}
let prevRl=0;
function sfxReload(){if(!audio)return;[0,.9].forEach(d=>{const t=audio.currentTime+d,o=audio.createOscillator(),g=audio.createGain();o.frequency.value=d?420:260;o.type="square";g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.1)})}
function initGL(){
  ren=new THREE.WebGLRenderer({canvas:$("gl"),antialias:false});ren.setPixelRatio(Math.min(devicePixelRatio,1.25));
  scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(70,1,1,8000);
  scene.userData.amb=new THREE.AmbientLight(0xffffff,.7);scene.add(scene.userData.amb);
  const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(300,600,200);scene.add(dl);

  const rs=()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();cv.width=innerWidth;cv.height=innerHeight};
  addEventListener("resize",rs);rs();buildMap();
}
function mkTex(lit,win){
  const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d");
  x.fillStyle=lit?"#1b1b28":"#d9d9d9";x.fillRect(0,0,64,64);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=lit?((i*7+j*3)%4<2?"#ffe08a":"#2a2a40"):win;x.fillRect(i*16+3,j*16+4,10,9)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=THREE.NearestFilter;return t;
}
function buildMap(){
  const m=MAPS[mapIdx];if(mapG)scene.remove(mapG);mapG=new THREE.Group();scene.add(mapG);
  scene.background=new THREE.Color(m.sky);scene.fog=new THREE.Fog(m.sky,900,3200);scene.userData.amb.intensity=m.amb;
  const bx=(cx,y0,cz,w,h,d,col,mat)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat||new THREE.MeshLambertMaterial({color:col}));o.position.set(cx,y0+h/2,cz);mapG.add(o);return o};
  bx(W/2,-2,H/2,12000,2,12000,m.ground);
  for(const[a,b,w,h]of m.park||[])bx(a+w/2,0,b+h/2,w,.6,h,0x3f8f4a);
  const T=mkTex(m.lit,m.win);
  WALLS.forEach(([a,b,w,d],i)=>{
    const h=m.hf(i),t=T.clone();t.needsUpdate=true;t.repeat.set(Math.max(1,Math.round(w/60)),Math.max(1,Math.round(h/60)));
    const mat=new THREE.MeshLambertMaterial({map:t,color:m.tint[i%m.tint.length]});
    if(m.lit){mat.emissive=new THREE.Color(0xffffff);mat.emissiveMap=t;mat.emissiveIntensity=.9}
    bx(a+w/2,0,b+d/2,w,h,d,0,mat);
  });
  bx(W/2,0,-4,W+8,12,8,m.edge);bx(W/2,0,H+4,W+8,12,8,m.edge);bx(-4,0,H/2,8,12,H,m.edge);bx(W+4,0,H/2,8,12,H,m.edge);
  const g=new THREE.Group();g.scale.set(K,1.6,K);mapG.add(g);
  const sb=(cx,y0,cz,w,h,d,col)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));o.position.set(cx,y0+h/2,cz);g.add(o)};
  m.extra&&m.extra(sb,g);
}
const SK={};
function skinTex(){
  if(SK.ok)return SK;SK.ok=1;
  const pal={H:"#3b2a17",S:"#c49374",W:"#ffffff",E:"#463b99",N:"#a8765a",M:"#6e4a35",C:"#12a8a8",P:"#3c3f94",G:"#6a6a6a"};
  const T=rows=>{const c=document.createElement("canvas");c.width=rows[0].length;c.height=rows.length;const x=c.getContext("2d");
    rows.forEach((r,j)=>[...r].forEach((ch,i)=>{x.fillStyle=pal[ch];x.fillRect(i,j,1,1)}));
    const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;return t};
  const sol=(c,w,h)=>T(Array(h).fill(c.repeat(w)));
  const hs=["HHHHHHHH","HHHHHHHH","HHHHSSSS","HHHHSSSS"],hn=hs.map(r=>[...r].reverse().join("")),sk=Array(4).fill("SSSSSSSS");
  SK.head=[T(["HHHHHHHH","HHHHHHHH","HSSSSSSH","SSSSSSSS","SWESSEWS","SSSNNSSS","SSMMMMSS","SSSMMSSS"]),sol("H",8,8),sol("H",8,8),sol("S",8,8),T(hs.concat(sk)),T(hn.concat(sk))];
  SK.body=[sol("C",4,15),sol("C",4,15),sol("C",4,4),sol("P",4,4),sol("C",8,15),sol("C",8,15)];
  const arm=T(["CCCC","CCCC","CCCC","CCCC"].concat(Array(11).fill("SSSS")));
  SK.arm=[arm,arm,sol("C",4,4),sol("S",4,4),arm,arm];
  const leg=T(Array(11).fill("PPPP").concat(Array(4).fill("GGGG")));
  SK.leg=[leg,leg,sol("P",4,4),sol("G",4,4),leg,leg];
  return SK;
}
function mkSteve(col){
  const S=skinTex(),g=new THREE.Group(),mats=[];
  const part=(faces,w,h,d)=>{const ms=faces.map(t=>{const m=new THREE.MeshLambertMaterial({map:t});mats.push(m);return m});return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ms)};
  const pivot=(x,y,z)=>{const o=new THREE.Group();o.position.set(x,y,z);g.add(o);return o};
  const head=part(S.head,10,10,10);head.position.y=35;g.add(head);
  const body=part(S.body,5,15,10);body.position.y=22.5;g.add(body);
  const legs=[-2.5,2.5].map(z=>{const o=pivot(0,15,z),l=part(S.leg,5,15,5);l.position.y=-7.5;o.add(l);return o});
  const aL=pivot(0,30,-7.5),l=part(S.arm,5,15,5);l.position.y=-7.5;aL.add(l);
  const aR=pivot(0,30,7.5),r=part(S.arm,5,15,5);r.position.y=-7.5;aR.add(r);aR.rotation.z=Math.PI/2;
  const gm=new THREE.MeshLambertMaterial({color:0x8a8f98}),gun=new THREE.Mesh(new THREE.BoxGeometry(4,13,3),gm);gun.position.y=-21;aR.add(gun);
  const ring=new THREE.Mesh(new THREE.CylinderGeometry(R+3,R+3,1,20),new THREE.MeshLambertMaterial({color:col}));ring.position.y=.5;g.add(ring);
  g.userData={mats,legs,aL,ph:0,amp:0,lx:null,ly:0};return g;
}
function draw(){const now=performance.now(),dt=Math.min(.05,(now-lastDraw)/1000);lastDraw=now;
  const s=isHost?{p:Object.entries(players).map(([id,p])=>[id,p.x,p.y,p.a,p.hp,p.k,p.d,p.name,p.c,p.dead>0?1:0,p.z,p.ammo,p.rl>0?Math.max(1,Math.round(100-p.rl/RT*100)):0]),b:bullets.map(b=>[b.x,b.y,b.z]),sh:shots}:clientView(dt);
  if(s&&s.sh!==undefined){if(s.sh>prevShots)sfxShot();prevShots=s.sh}
  const cw=cv.width,ch=cv.height;ctx.clearRect(0,0,cw,ch);
  if(!s){ren.render(scene,cam);ctx.fillStyle="#fff";ctx.font="20px sans-serif";ctx.textAlign="center";ctx.fillText("Waiting for host...",cw/2,ch/2);return}
  const seen={};
  for(const[id,x,y,a,hp,k,d,name,c,dead,z]of s.p){
    seen[id]=1;let g=pm[id];if(!g){g=pm[id]=mkSteve(COLORS[c]);scene.add(g)}
    if(prevHp[id]!==undefined&&hp<prevHp[id]){hitT[id]=.25;if(id===myId){flash=.45;sfxHurt()}}
    prevHp[id]=hp;if(hitT[id]>0)hitT[id]-=dt;
    g.position.set(x,z||0,y);g.rotation.y=-a;g.visible=!dead;
    const u=g.userData,mv=u.lx===null?0:Math.hypot(x-u.lx,y-u.ly);u.lx=x;u.ly=y;
    u.ph+=Math.min(mv,40)*0.08;u.amp+=((mv>0.4&&!(z>1)?1:0)-u.amp)*0.25;
    const sw=Math.sin(u.ph)*0.7*u.amp;u.legs[0].rotation.z=sw;u.legs[1].rotation.z=-sw;u.aL.rotation.z=-sw*0.8;
    g.userData.mats.forEach(m=>m.emissive.setHex(hitT[id]>0?0xff0000:0));
  }
  for(const id in pm)if(!seen[id]){scene.remove(pm[id]);delete pm[id]}
  while(bm.length<s.b.length){const o=new THREE.Mesh(bGeo,bMat);scene.add(o);bm.push(o)}
  bm.forEach((o,i)=>{const b=s.b[i];o.visible=!!b;if(b)o.position.set(b[0],b[2],b[1])});
  const me=s.p.find(p=>p[0]===myId);
  if(me){
    const cp=Math.cos(pitch),sp=Math.sin(pitch),fx=Math.cos(yaw)*cp,fz=Math.sin(yaw)*cp,px=me[1]-Math.sin(yaw)*10,py=(me[10]||0)+36,pz=me[2]+Math.cos(yaw)*10;
    let dd=110;const bl=t=>{const w=wallAt(px-fx*t,pz-fz*t,5);return w>=0&&Math.max(2,py-sp*t)<WH[w]};
    while(dd>25&&bl(dd))dd-=10;
    cam.position.set(px-fx*dd,Math.max(3,py-sp*dd),pz-fz*dd);
    cam.lookAt(cam.position.x+fx*100,cam.position.y+sp*100,cam.position.z+fz*100);
  }
  ren.render(scene,cam);
  const v=new THREE.Vector3();ctx.textAlign="center";ctx.font="bold 13px 'Chakra Petch',sans-serif";
  for(const[id,x,y,a,hp,k,d,name,c,dead,z]of s.p){
    if(id===myId||dead)continue;v.set(x,48+(z||0),y).project(cam);if(v.z>1)continue;
    const sx=(v.x+1)/2*cw,sy=(1-v.y)/2*ch;
    ctx.fillStyle="#161a22";ctx.fillRect(sx-20,sy-12,40,5);ctx.fillStyle=hp>40?"#06d6a0":"#ff6b57";ctx.fillRect(sx-20,sy-12,40*hp/100,5);
    ctx.fillStyle="#fff";ctx.fillText(name,sx,sy-16);
  }
  ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(cw/2-12,ch/2);ctx.lineTo(cw/2-4,ch/2);ctx.moveTo(cw/2+4,ch/2);ctx.lineTo(cw/2+12,ch/2);
  ctx.moveTo(cw/2,ch/2-12);ctx.lineTo(cw/2,ch/2-4);ctx.moveTo(cw/2,ch/2+4);ctx.lineTo(cw/2,ch/2+12);ctx.stroke();
  if(flash>0){ctx.fillStyle="rgba(255,0,0,"+Math.min(.4,flash)+")";ctx.fillRect(0,0,cw,ch);flash-=dt}
  const sorted=[...s.p].sort((a,b)=>b[5]-a[5]);
  ctx.textAlign="right";ctx.font="14px 'Chakra Petch',sans-serif";
  sorted.forEach((p,i)=>{ctx.fillStyle=COLORS[p[8]];ctx.fillText(`${p[7]}  ${p[5]} / ${p[6]}`,cw-12,22+i*20)});
  if(me){
    const hp=me[9]?0:Math.max(0,Math.ceil(me[4])),bx=16,by=ch-42,bw=240,bh=28;
    ctx.fillStyle="#161a22";ctx.fillRect(bx-3,by-3,bw+6,bh+6);
    ctx.fillStyle=hp>50?"#06d6a0":hp>25?"#ffd166":"#ff4d4d";ctx.fillRect(bx,by,bw*hp/100,bh);
    ctx.strokeStyle="#3a4558";ctx.lineWidth=2;ctx.strokeRect(bx-3,by-3,bw+6,bh+6);
    ctx.textAlign="center";ctx.font="bold 18px 'Chakra Petch',sans-serif";
    ctx.lineWidth=4;ctx.strokeStyle="#161a22";ctx.strokeText(hp+" / 100",bx+bw/2,by+20);
    ctx.fillStyle="#fff";ctx.fillText(hp+" / 100",bx+bw/2,by+20);
    const am=me[11]??MAG,rl=me[12]||0,ax=cw-16;
    if(rl>0&&!prevRl)sfxReload();prevRl=rl;
    ctx.textAlign="right";ctx.font="bold 34px 'Chakra Petch',sans-serif";ctx.lineWidth=4;ctx.strokeStyle="#161a22";
    const tx=am+"/"+MAG;ctx.strokeText(tx,ax,by+24);ctx.fillStyle=am<=5?"#ff6b57":"#fff";ctx.fillText(tx,ax,by+24);
    if(rl){ctx.font="bold 14px 'Chakra Petch',sans-serif";ctx.fillStyle="#ffd166";ctx.fillText("RELOADING",ax,by-24);ctx.fillStyle="#161a22";ctx.fillRect(ax-200,by-16,200,8);ctx.fillStyle="#ffd166";ctx.fillRect(ax-200,by-16,2*rl,8)}
    else if(am<=5){ctx.font="bold 14px 'Chakra Petch',sans-serif";ctx.fillStyle="#fff";ctx.fillText("Press R to reload",ax,by-8)}
  }
  ctx.textAlign="center";ctx.fillStyle="#eef1f6";ctx.font="bold 28px 'Chakra Petch',sans-serif";
  if(me&&me[9])ctx.fillText("You were hit. Respawning...",cw/2,60);
  if(document.pointerLockElement!==cv){ctx.font="bold 20px 'Chakra Petch',sans-serif";ctx.fillText("Click to play (Esc to release the mouse)",cw/2,ch-70)}
}
